<style>

.novo-tag{background:var(--red);color:#fff;border-color:var(--red)}
.linha-t{border-left:2px solid var(--line);margin:8px 0 0 10px;padding-left:20px}.ev{position:relative;margin:0 0 20px}.ev::before{content:'';position:absolute;left:-29px;top:7px;width:14px;height:14px;border-radius:50%;background:var(--red);border:2px solid var(--gold)}.ev.oc::before{background:#555;border-style:dashed}
.ev .rot{font-family:Cinzel,serif;color:var(--gold);font-size:14px;letter-spacing:1px}.moeda{font-size:34px;font-family:Cinzel,serif}
label.campo{display:grid;gap:4px;color:var(--dim);font-size:15px;flex:1;min-width:90px}
header{flex-direction:column;align-items:stretch;gap:8px}.topo{display:flex;align-items:center;gap:10px}.topo h1{margin:0 auto 0 0}

.sec{display:flex;align-items:center;gap:10px;margin:28px 0 12px;font-family:Cinzel,serif;font-size:13px;letter-spacing:2px;color:var(--gold);text-transform:uppercase}.sec .n{color:#a8743a;font-size:19px;letter-spacing:0}.sec::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,rgba(201,165,92,.5),transparent)}

.painel{flex:1;background:linear-gradient(#1c1513,#120c0b);border:1px solid #5a4630;padding:14px 16px 14px 24px;position:relative;box-shadow:inset 0 0 40px rgba(0,0,0,.6)}

.papel{position:relative;background:linear-gradient(135deg,#ece0c6,#d6c69c);color:#2a1d10;border:1px solid #6b5a3a;padding:18px 20px 12px;box-shadow:inset 0 0 60px rgba(90,60,20,.3),0 8px 24px rgba(0,0,0,.55)}.papel h3{font-family:'Playfair Display',serif;font-size:21px;margin:0 0 8px;color:#2a1d10;font-weight:900}

.meta{display:flex;gap:10px;align-items:baseline;padding:9px 0;border-top:1px solid rgba(90,60,20,.3)}.meta::before{content:'◆';color:#6b2d1c;font-size:13px}.meta b{display:block;font-size:19px}.meta span{color:#6b5a3a;font-size:16px}
.seta{display:flex;align-items:center;margin:20px 0;color:var(--red)}.seta::before{content:'';border:6px solid transparent;border-right:11px solid currentColor;border-left:0}.seta::after{content:'';border:6px solid transparent;border-left:11px solid currentColor;border-right:0}.seta i{flex:1;height:2px;background:currentColor}

.card{box-shadow:inset 0 1px 0 rgba(255,220,160,.06),0 6px 18px rgba(0,0,0,.35)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--cristal);outline-offset:2px}
button:active{transform:translateY(1px) scale(.98)}button{transition:transform .12s,border-color .15s,background .15s}
.pri{position:relative;overflow:hidden}.pri::after{content:'';position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.28) 50%,transparent 70%);transform:translateX(-120%);animation:brilho 5s 1.5s infinite}
.ic{width:16px;height:16px;flex:none}.grupos button{display:inline-flex;align-items:center;gap:7px}

#v.entra>*{animation:subir .5s cubic-bezier(.2,.7,.2,1) both}#v.entra>*:nth-child(2){animation-delay:.05s}#v.entra>*:nth-child(3){animation-delay:.1s}#v.entra>*:nth-child(4){animation-delay:.15s}#v.entra>*:nth-child(5){animation-delay:.2s}#v.entra>*:nth-child(6){animation-delay:.25s}#v.entra>*:nth-child(n+7){animation-delay:.3s}
.barra b{width:100%;transform:scaleX(var(--p,1));transform-origin:0 50%;animation:encher 1.1s cubic-bezier(.2,.8,.2,1) both}.barra b.baixo{animation:encher 1.1s cubic-bezier(.2,.8,.2,1) both,pulsa 1.8s 1.2s ease-in-out infinite}
.io .ev{opacity:0;transform:translateY(12px);transition:opacity .6s,transform .6s}.io .ev.vis{opacity:1;transform:none}
.linha-t{border-left:0;position:relative}.linha-t::before{content:'';position:absolute;left:-1px;top:0;bottom:0;width:2px;background:var(--line);transform-origin:top;animation:traca 1.4s ease-out both}
.perg.abre{animation:desenrola .9s ease-out both}.selo{position:absolute;left:50%;top:-16px;width:48px;height:48px;margin-left:-24px;border-radius:50%;z-index:2;background:radial-gradient(circle at 35% 30%,#e0554f,#7a1d1a 70%);box-shadow:0 3px 10px rgba(0,0,0,.6),inset 0 0 0 4px rgba(0,0,0,.18);animation:quebra 1.5s .55s ease-in forwards}
.selo-mini{display:inline-block;width:16px;height:16px;border-radius:50%;margin-left:8px;vertical-align:-2px;background:radial-gradient(circle at 35% 30%,#e0554f,#7a1d1a 70%);box-shadow:0 0 8px rgba(224,85,79,.6)}
@keyframes subir{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}@keyframes encher{from{transform:scaleX(0)}}@keyframes pulsa{50%{opacity:.45}}@keyframes brilho{0%,60%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
@keyframes traca{from{transform:scaleY(0)}}@keyframes desenrola{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0)}}@keyframes quebra{0%{transform:scale(1)}35%{transform:scale(1.15) rotate(8deg)}100%{transform:scale(1.7) rotate(26deg);opacity:0}}

.capa-hero{display:flex;gap:22px;align-items:center;justify-content:center;flex-wrap:wrap;padding:18px 0 4px;perspective:700px}
.capa-hero img{width:150px;border-radius:6px;border:2px solid var(--bronze);box-shadow:0 0 0 4px rgba(0,0,0,.4),0 14px 40px rgba(0,0,0,.7),0 0 40px rgba(76,195,255,.18);transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .15s;animation:flutua 6s ease-in-out infinite}
.capa-txt{text-align:center}.capa-txt h1{font-size:clamp(36px,9vw,60px);margin:0;letter-spacing:4px;font-weight:700;text-shadow:0 0 28px rgba(216,64,58,.55)}
.npc{position:relative;background:linear-gradient(#1d1512,#110b0a);border:2px solid var(--bronze);outline:1px solid rgba(201,165,92,.4);outline-offset:-7px;border-radius:10px;padding:12px 10px 14px;transition:transform .2s,box-shadow .2s}.npc:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(0,0,0,.6),0 0 18px rgba(76,195,255,.12)}

.galeria{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}.gal{margin:0;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:zoom-in;transition:transform .2s,border-color .2s}.gal:hover{transform:translateY(-3px);border-color:var(--bronze)}.gal img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}.gal figcaption{padding:8px 10px;font-size:15px;color:var(--dim)}

<body>
<div id="app"></div><div id="aviso" role="alert"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let sb, perfil = null, aba = 'inicio';
const mestre = () => perfil && perfil.papel === 'mestre';
const data = d => d ? new Date(d + 'T12:00').toLocaleDateString('pt-BR') : '';

function aviso(m) { const a = $('#aviso'); a.textContent = m; a.style.display = 'block'; clearTimeout(aviso.t); aviso.t = setTimeout(() => a.style.display = 'none', 5000); }
async function q(p) { const { data: d, error } = await p; if (error) { aviso(error.message); return null; } return d; }
function tela(h) { $('#app').innerHTML = h; }

function init() {
  const c = window.CONFIG || {};
  if (!c.SUPABASE_URL || c.SUPABASE_URL.startsWith('COLE')) return tela('<div class="login"><div class="card"><h2>Falta configurar</h2><p>Abra o arquivo <b>config.js</b> e cole a URL e a chave pública do seu projeto no Supabase.</p></div></div>');
  sb = supabase.createClient(c.SUPABASE_URL, c.SUPABASE_ANON_KEY);
  sb.auth.onAuthStateChange((_e, s) => setTimeout(() => carregar(s), 0));
}
async function carregar(sessao) {
  if (!sessao) { perfil = null; return telaLogin(); }
  let r = await sb.from('profiles').select('*').eq('id', sessao.user.id).maybeSingle();
  if (!r.data) { await new Promise(t => setTimeout(t, 800)); r = await sb.from('profiles').select('*').eq('id', sessao.user.id).maybeSingle(); }
  perfil = r.data;
  if (!perfil) return tela('<div class="login"><div class="card"><h2>Não foi possível carregar seu perfil</h2><p>Confira se o schema.sql foi executado no Supabase e tente entrar de novo.</p><button onclick="sb.auth.signOut()">Sair</button></div></div>');
  if (!perfil.liberado) return tela(`<div class="login"><div class="card" style="text-align:center"><h2>Quase lá, ${esc((perfil.nome || '').split(' ')[0])}</h2><p>Seu acesso ainda não foi liberado. Avise o mestre para liberar o e-mail <b>${esc(perfil.email)}</b>.</p><div class="row" style="justify-content:center"><button onclick="location.reload()">Verificar de novo</button><button onclick="sb.auth.signOut()">Sair</button></div></div></div>`);
  app();

function observarEv() {
  if (!('IntersectionObserver' in window)) return;
  document.documentElement.classList.add('io');
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('vis'); io.unobserve(e.target); } }), { threshold: .12 });
  document.querySelectorAll('.ev:not(.vis)').forEach(el => io.observe(el));
}

  ligar();
})();

const GAL = [['capa.jpg', 'Capa do livro'], ['p2-1.jpg', 'A Alvorada de Alagaësia'], ['p3-1.jpg', 'A Guerra dos Dragões e o Pacto'], ['p4-1.jpg', 'A chegada dos humanos'], ['p6-1.jpg', 'A Queda dos Treze Renegados'], ['p7-1.jpg', 'Cavaleiro e dragão nas ruínas'], ['p19-1.jpg', 'A coroação do Rei dos Anões'], ['p20-1.jpg', 'Ritos dos Deuses Antigos'], ['p20-2.jpg', 'Os nômades de Hadarac'], ['p21-1.jpg', 'O culto de Helgrind']].map(([f, t]) => ['img/livro/' + f, t]).concat([['img/mapa.jpg', 'Mapa de Alagaësia']]);
async function vGaleria() { return `<h2>Galeria</h2><p class="dim" style="margin:0 0 14px">As ilustrações do livro da campanha. Toque para ampliar.</p><div class="galeria">${GAL.map((g, i) => `<figure class="gal" onclick="zoomImg(${i})"><img loading="lazy" src="${g[0]}" alt="${esc(g[1])}"><figcaption>${esc(g[1])}</figcaption></figure>`).join('')}</div>`; }
function zoomImg(i) { const d = document.createElement('div'); d.id = 'lb'; d.onclick = () => d.remove(); d.innerHTML = `<img src="${GAL[i][0]}" alt="${esc(GAL[i][1])}"><p>${esc(GAL[i][1])}</p>`; document.body.appendChild(d); }
addEventListener('keydown', e => { if (e.key === 'Escape') { const l = $('#lb'); if (l) l.remove(); } });
function capaParallax() {
  const el = document.querySelector('.capa-hero'); if (!el) return; const im = el.querySelector('img'); if (!im) return;
  el.addEventListener('pointermove', e => { const r = el.getBoundingClientRect(), x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5; im.style.setProperty('--ry', (x * 14) + 'deg'); im.style.setProperty('--rx', (-y * 10) + 'deg'); });
  el.addEventListener('pointerleave', () => { im.style.setProperty('--ry', '0deg'); im.style.setProperty('--rx', '0deg'); });
}
if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));

init();
</script>
